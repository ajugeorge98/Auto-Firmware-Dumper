name: Auto Firmware Dumper

on:
  workflow_dispatch:
    inputs:
      USER_NAME:
        description: 'GitHub Username'
        required: true
        default: 'ajugeorge98'
      USER_EMAIL:
        description: 'GitHub Email'
        required: true
        default: 'ajimsjames.gvilla@gmail.com'
      FIRMWARE_URL:
        description: 'Stock ROM Link'
        required: true
        default: 'https://mirrors.lolinet.com/firmware/lenomola/2024/tank/official/TELEU/XT2407-1_TANK_TELEU_15_V1UWS35H.63-14-6-4-2-4_subsidy-DEFAULT_regulatory-DEFAULT_cid50_CFC.xml.zip'
      GENERATE_VENDOR:
        description: 'Create Vendor Tree'
        required: true
        default: 'false'
        type: boolean
      UPLOAD_LINEAGE_DT:
        description: 'Upload LineageOS tree'
        required: true
        default: 'false'
        type: boolean
      UPLOAD_TWRP_DT:
        description: 'Upload TWRP tree'
        required: true
        default: 'false'
        type: boolean

jobs:
  dump:
    name: Auto Firmware Dumper
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      # GITHUB_TOKEN removed from here to fix authentication conflict
      TWT: ${{ github.event.inputs.UPLOAD_TWRP_DT }}
      LOT: ${{ github.event.inputs.UPLOAD_LINEAGE_DT }}
      GVT: ${{ github.event.inputs.GENERATE_VENDOR }}
      FUR: ${{ github.event.inputs.FIRMWARE_URL }}
      UN: ${{ github.event.inputs.USER_NAME }}
      UEM: ${{ github.event.inputs.USER_EMAIL }}
    
    steps:
      - uses: actions/checkout@v4
      - uses: rokibhasansagar/slimhub_actions@main
      - uses: sersoft-gmbh/setup-gh-cli-action@v2
        with:
          version: stable

      - name: Setting Up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip lz4 axel p7zip-full
          pip install uv
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p workdir
          bash scripts/full_setup.sh "$PWD/workdir"

      - name: Authorize Git And GitHub CLI
        run: |
          . scripts/common_functions.sh
          # Pass the GTOKEN secret directly to the function
          git_auth "${{ env.UN }}" "${{ env.UEM }}" "${{ secrets.GTOKEN }}"
        working-directory: ${{ github.workspace }}

      - name: Create Dump
        run: |
          cd workdir/DumprX
          bash dumper.sh "${{ env.FUR }}"
          sudo chown -R $USER:$USER out
          chmod -R 755 out
        working-directory: ${{ github.workspace }}

      - name: Upload Generated Trees
        run: |
          . scripts/common_functions.sh
          BASE_DIR="${{ github.workspace }}"
          DUMP_OUT="$BASE_DIR/workdir/DumprX/out"
          
          # Move to the output directory where trees are generated
          cd "$DUMP_OUT"

          # 1. Upload Vendor Tree if GENERATE_VENDOR is true
          if [ "${{ env.GVT }}" == "true" ]; then
            echo "Uploading Vendor Tree..."
            # Adjust 'vendor/*' to the actual path generated by your script
            export GITHUB_TOKEN="${{ secrets.GTOKEN }}"
            bash "$BASE_DIR/scripts/upload_to_repo.sh" "$DUMP_OUT/vendor" vendor_tree
          fi

          # 2. Upload LineageOS Tree if UPLOAD_LINEAGE_DT is true
          if [ "${{ env.LOT }}" == "true" ]; then
            echo "Uploading LineageOS Device Tree..."
            # Adjust 'device/*' to the actual path (e.g., device/motorola/diwali)
            export GITHUB_TOKEN="${{ secrets.GTOKEN }}"
            bash "$BASE_DIR/scripts/upload_to_repo.sh" "$DUMP_OUT/device" lineage_tree
          fi

          # 3. Upload TWRP Tree if UPLOAD_TWRP_DT is true
          if [ "${{ env.TWT }}" == "true" ]; then
            echo "Uploading TWRP Device Tree..."
            # Usually generated in a 'twrp' or separate 'device' folder
            export GITHUB_TOKEN="${{ secrets.GTOKEN }}"
            bash "$BASE_DIR/scripts/upload_to_repo.sh" "$DUMP_OUT/twrp" twrp_tree
          fi
        working-directory: ${{ github.workspace }}
