name: Auto Firmware Dumper

on:
  workflow_dispatch:
    inputs:
      USER_NAME:
        description: 'Name of your GitHub Account'
        required: true
        default: 'ajugeorge98'
      USER_EMAIL:
        description: 'E-mail of your GitHub Account'
        required: true
        default: 'ajimsjames.gvilla@gmail.com'
      FIRMWARE_URL:
        description: 'Stock ROM Link'
        required: true
        default: ''
      GENERATE_VENDOR:
        description: 'Create Vendor Tree'
        required: true
        default: 'false'
        type: boolean
      UPLOAD_LINEAGE_DT:
        description: 'Upload LineageOS tree'
        required: true
        default: 'false'
        type: boolean
      UPLOAD_TWRP_DT:
        description: 'Upload TWRP tree'
        required: true
        default: 'false'
        type: boolean

jobs:
  dump:
    name: Auto Firmware Dumper
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GTOKEN }}
      TWT: ${{ github.event.inputs.UPLOAD_TWRP_DT }}
      LOT: ${{ github.event.inputs.UPLOAD_LINEAGE_DT }}
      GVT: ${{ github.event.inputs.GENERATE_VENDOR }}
      FUR: ${{ github.event.inputs.FIRMWARE_URL }}
      UN: ${{ github.event.inputs.USER_NAME }}
      UEM: ${{ github.event.inputs.USER_EMAIL }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: rokibhasansagar/slimhub_actions@main
      - uses: sersoft-gmbh/setup-gh-cli-action@v2
        with:
          version: stable

      - name: Setting Up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip lz4 axel p7zip-full
          # Install uv to fix the 'uvx command not found' error
          pip install uv
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo chmod -R 755 *
          mkdir -p workdir
          bash scripts/full_setup.sh "$PWD/workdir"
        working-directory: ${{ github.workspace }}

      - name: Authorize Git And GitHub CLI
        run: |
          . scripts/common_functions.sh
          git_auth "${{ env.UN }}" "${{ env.UEM }}" "${{ env.GITHUB_TOKEN }}"
        working-directory: ${{ github.workspace }}

      - name: Create Dump
        run: |
          cd workdir/DumprX
          # We run without sudo to avoid permission issues with the 'env' file
          bash dumper.sh "${{ env.FUR }}"
          # Ensure the runner owns the output
          sudo chown -R $USER:$USER out
          chmod -R 755 out
        working-directory: ${{ github.workspace }}

      - name: Upload ROM Dump
        run: |
          . scripts/common_functions.sh
          # Move into the dumper directory to ensure dump_props finds the output
          cd workdir/DumprX
          dump_props_to_env_file "$PWD/out"
          
          # Check if env exists before sourcing
          if [ -f "env" ]; then
            mv env ${{ github.workspace }}/env
          else
            echo "::error::env file was not generated! Extraction might have failed."
            exit 1
          fi

          cd ${{ github.workspace }}
          . env
          
          cd workdir/DumprX/out
          lineageDir="lineage-device-tree"
          teamWinDir="twrp-device-tree"
          
          if [ -d "$lineageDir" ]; then cp -r "$lineageDir" ${{ github.workspace }}; fi
          if [ -d "$teamWinDir" ]; then cp -r "$teamWinDir" ${{ github.workspace }}; fi
          
          compress_files "$PWD"
          bash ${{ github.workspace }}/scripts/upload_to_repo.sh "$PWD" dump
        working-directory: ${{ github.workspace }}

      - name: Create And Upload Vendor Tree
        if: env.GVT == 'true'
        run: |
          . scripts/common_functions.sh
          [ -f env ] && . env
          cd workdir
          lineageDir="${{ github.workspace }}/lineage-device-tree"
          mkdir -p android/device/$BRAND/$DEVICE
          if [ -d "$lineageDir" ]; then 
            cp -r $lineageDir/* android/device/$BRAND/$DEVICE
          else 
            echo "Cannot find Lineage device tree!"
            exit 1
          fi
          cd android/device/$BRAND/$DEVICE && chmod 755 *.sh
          # Extract blobs from the dumped 'out' folder
          bash extract-files.sh ${{ github.workspace }}/workdir/DumprX/out
          cd ../../vendor/$BRAND/$DEVICE
          chmod -R 755 *
          bash ${{ github.workspace }}/scripts/upload_to_repo.sh "$PWD" vendor
        working-directory: ${{ github.workspace }}

      - name: Upload LineageOS Device Tree
        if: env.LOT == 'true'
        run: |
          [ -f env ] && . env
          bash ${{ github.workspace }}/scripts/upload_to_repo.sh "${{ github.workspace }}/lineage-device-tree" lineage lineage_device
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Upload TWRP Device Tree
        if: env.TWT == 'true'
        run: |
          [ -f env ] && . env
          # Search for the recovery tree in the correct subfolder
          find twrp-device-tree -name "$CODENAME" -type d -exec bash ${{ github.workspace }}/scripts/upload_to_repo.sh {} twrp recovery_device \;
        working-directory: ${{ github.workspace }}
        continue-on-error: true
