name: TWRP Tree Generator (Full Auto)

on:
  workflow_dispatch:
    inputs:
      USER_NAME:
        description: 'GitHub Username'
        required: true
        default: 'ajugeorge98'
      USER_EMAIL:
        description: 'GitHub Email'
        required: true
        default: 'ajimsjames.gvilla@gmail.com'
      FIRMWARE_URL:
        description: 'Direct Stock ROM Link'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GTOKEN }}
      UN: ${{ github.event.inputs.USER_NAME }}
      UEM: ${{ github.event.inputs.USER_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip lz4 axel p7zip-full python3-dev
          pip install twrpdtgen
          mkdir -p workdir/out

      - name: Download & Extract Images
        run: |
          cd workdir
          # Download firmware
          axel -n 8 -a "${{ github.event.inputs.FIRMWARE_URL }}" -o firmware.zip
          
          # Extract images needed for tree and fstab
          unzip firmware.zip "boot.img" "recovery.img" "vendor_boot.img" "vendor.img" "system.img" "dtbo.img" "dtb" -d out || true
          
          # Handle payload.bin (Modern Motorola/OnePlus)
          if [ -f out/payload.bin ]; then
            wget https://github.com/ssut/payload-dumper-go/releases/download/v1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
            tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
            ./payload-dumper-go -p boot,vendor_boot,recovery,vendor,system,dtbo,dtb -o out out/payload.bin
          fi

      - name: Generate Tree & Extract Fstab
        run: |
          # 1. Locate images robustly (Recursive search)
          # This ensures that even if files are in out/extracted/boot.img, we find them.
          IMG_DIR="$GITHUB_WORKSPACE/workdir/out"
          BOOT_IMG=$(find "$IMG_DIR" -name "boot.img" | head -n 1)
          RECOVERY_IMG=$(find "$IMG_DIR" -name "recovery.img" | head -n 1)
          V_BOOT_IMG=$(find "$IMG_DIR" -name "vendor_boot.img" | head -n 1)

          # Pick the best target: Recovery > Boot > Vendor_Boot
          TARGET_IMG=""
          if [ -f "$RECOVERY_IMG" ]; then TARGET_IMG="$RECOVERY_IMG";
          elif [ -f "$BOOT_IMG" ]; then TARGET_IMG="$BOOT_IMG";
          elif [ -f "$V_BOOT_IMG" ]; then TARGET_IMG="$V_BOOT_IMG"; fi

          if [ -z "$TARGET_IMG" ]; then 
            echo "❌ ERROR: No boot/recovery image found in $IMG_DIR"
            ls -R "$IMG_DIR" # Debugging: Print everything found
            exit 1 
          fi

          echo "✅ Found Target Image: $TARGET_IMG"

          # 2. Run twrpdtgen using absolute path
          cd "$IMG_DIR"
          python3 -m twrpdtgen "$TARGET_IMG"

          # 3. Identify generated path
          TREE_PATH=$(find output -mindepth 2 -maxdepth 2 -type d | head -n 1)
          if [ -z "$TREE_PATH" ]; then echo "❌ Tree generation failed"; exit 1; fi
          
          CODENAME=$(basename "$TREE_PATH")
          BRAND=$(basename $(dirname "$TREE_PATH"))
          echo "✅ Generated Tree for: $BRAND $CODENAME"

          # 4. Extract Fstab
          mkdir -p fstab_out
          find . -name "vendor.img" -o -name "system.img" | while read img; do
            7z e "$img" "etc/fstab*" "etc/recovery.fstab" -ofstab_out -r -y || true
          done
          
          # Move fstabs
          cp fstab_out/fstab.* "$TREE_PATH/recovery.fstab" 2>/dev/null || cp fstab_out/recovery.fstab "$TREE_PATH/recovery.fstab" 2>/dev/null || echo "No fstab found"

          # 5. Kernel Offsets with MagiskBoot
          wget -q https://raw.githubusercontent.com/Drag0n-Y/magiskboot_binary/main/magiskboot
          chmod +x magiskboot
          ./magiskboot unpack "$TARGET_IMG"
          
          if [ -f header ]; then
            PS=$(grep "pagesize" header | cut -d'=' -f2)
            BS=$(grep "base" header | cut -d'=' -f2)
            # Use sed carefully or append if missing
            sed -i "/BOARD_BOOT_PAGESIZE/c\BOARD_BOOT_PAGESIZE := $PS" "$TREE_PATH/BoardConfig.mk"
            grep -q "BOARD_KERNEL_BASE" "$TREE_PATH/BoardConfig.mk" || echo "BOARD_KERNEL_BASE := $BS" >> "$TREE_PATH/BoardConfig.mk"
          fi

          # 6. Prebuilts
          mkdir -p "$TREE_PATH/prebuilt"
          find . -maxdepth 1 \( -name "kernel" -o -name "kernel.gz" -o -name "Image" -o -name "Image.gz" \) -exec cp {} "$TREE_PATH/prebuilt/kernel" \; -quit
          find . -maxdepth 1 -name "dtb" -exec cp {} "$TREE_PATH/prebuilt/dtb" \;
          find . -maxdepth 1 -name "dtbo.img" -exec cp {} "$TREE_PATH/prebuilt/dtbo.img" \;

          # Finalize environment variables
          echo "TREE_PATH=$PWD/$TREE_PATH" >> $GITHUB_ENV
          echo "REPO_NAME=android_device_${BRAND}_${CODENAME}-twrp" >> $GITHUB_ENV
      - name: Push to GitHub
        run: |
          cd ${{ env.TREE_PATH }}
          git init
          git config user.name "${{ env.UN }}"
          git config user.email "${{ env.UEM }}"
          git add .
          git commit -m "TWRP: Initial auto-generated tree for ${{ env.REPO_NAME }}"
          
          gh repo create "${{ env.UN }}/${{ env.REPO_NAME }}" --public --confirm || true
          git remote add origin https://x-access-token:${{ secrets.GTOKEN }}@github.com/${{ env.UN }}/${{ env.REPO_NAME }}.git
          git push -u origin master -f
